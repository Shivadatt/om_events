services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: "mssql"
      DB_NAME: "EventPlatform"
      DB_USER: "sa"
      DB_PASSWORD: "${SA_PASSWORD}"
      DB_HOST: "db"
      DB_PORT: "1433"
      DB_DRIVER: "ODBC Driver 18 for SQL Server"
      DB_EXTRA_PARAMS: "TrustServerCertificate=yes"
      DEBUG: "false"
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: "Express"
    volumes:
      - mssql:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 12
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
volumes:
  mssql:
  uploads:
  logs:
